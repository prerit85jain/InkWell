# ═══════════════════════════════════════════════════════════════
#  InkWell — API Gateway  |  application-docker.properties
# ═══════════════════════════════════════════════════════════════

# ── Server ──────────────────────────────────────────────────────
server.port=8080
spring.application.name=api-gateway

# ── Service URLs (Docker container names) ───────────────────────
app.services.auth-service=http://auth-service:8081
app.services.post-service=http://post-service:8082
app.services.comment-service=http://comment-service:8083
app.services.category-service=http://category-service:8084
app.services.media-service=http://media-service:8085
app.services.newsletter-service=http://newsletter-service:8086
app.services.notification-service=http://notification-service:8087

# ── JWT Secret ───────────────────────────────────────────────────
app.jwt.secret=InkWellSuperSecretKeyThatIsAtLeast256BitsLongForHMACSHA256Algorithm!

# ── Actuator ────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# ── Logging ─────────────────────────────────────────────────────
logging.level.com.inkwell.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=INFO
