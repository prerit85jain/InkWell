# ═══════════════════════════════════════════════════════════════
#  InkWell — API Gateway  |  application.properties
# ═══════════════════════════════════════════════════════════════

# ── Server ──────────────────────────────────────────────────────
server.port=8080
spring.application.name=api-gateway

# ── Service URLs ────────────────────────────────────────────────
app.services.auth-service=http://localhost:8081
app.services.post-service=http://localhost:8082
app.services.comment-service=http://localhost:8083
app.services.category-service=http://localhost:8084
app.services.media-service=http://localhost:8085
app.services.newsletter-service=http://localhost:8086
app.services.notification-service=http://localhost:8087

# ── JWT Secret ───────────────────────────────────────────────────
app.jwt.secret=InkWellSuperSecretKeyThatIsAtLeast256BitsLongForHMACSHA256Algorithm!

# ── Actuator ────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# ── Logging ─────────────────────────────────────────────────────
logging.level.com.inkwell.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=INFO
