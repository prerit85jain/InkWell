# ─────────────────────────────────────────────
#  InkWell :: Auth-Service
# ─────────────────────────────────────────────

server.port=8081
spring.application.name=auth-service

# ── DataSource ────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/inkwell_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=0513
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ── JWT ───────────────────────────────────────
app.jwt.secret=InkWellSuperSecretKeyThatIsAtLeast256BitsLongForHMACSHA256Algorithm!
app.jwt.expiration-ms=86400000

# ── OTP Configuration ─────────────────────────
app.otp.length=6
app.otp.expiry.minutes=5
app.otp.max-attempts=3
app.otp.rate-limit.max-requests=5
app.otp.rate-limit.window-minutes=15

# ── Email / SMTP ──────────────────────────────
app.mail.enabled=true
app.mail.from=noreply@inkwell.com
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── OAuth2 – Google ───────────────────────────
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile

# ── OAuth2 – GitHub ───────────────────────────
spring.security.oauth2.client.registration.github.client-id=YOUR_GITHUB_CLIENT_ID
spring.security.oauth2.client.registration.github.client-secret=YOUR_GITHUB_CLIENT_SECRET
spring.security.oauth2.client.registration.github.scope=user:email

# ── Springdoc / Swagger ───────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Logging ───────────────────────────────────
logging.level.com.inkwell.auth=DEBUG
logging.level.org.springframework.security=INFO
