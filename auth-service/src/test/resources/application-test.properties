# ── Test profile — uses H2 in-memory instead of MySQL ──────────
spring.datasource.url=jdbc:h2:mem:inkwell_auth_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Disable OAuth2 auto-config in tests
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-secret
spring.security.oauth2.client.registration.github.client-id=test-client-id
spring.security.oauth2.client.registration.github.client-secret=test-secret

app.jwt.secret=TestSecretKeyForJWTSigningMustBe256BitsLong1234567890ABCDEFGHIJ
app.jwt.expiration-ms=3600000
