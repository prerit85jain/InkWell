# ═══════════════════════════════════════════════════════════════
#  InkWell — Newsletter Service  |  application.properties
# ═══════════════════════════════════════════════════════════════

# ── Server ──────────────────────────────────────────────────────
server.port=8086
spring.application.name=newsletter-service

# ── DataSource (MySQL — dedicated schema) ───────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/inkwell_newsletter?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=0513
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Email (AWS SES via SMTP) ─────────────────────────────────────
spring.mail.host=email-smtp.ap-south-1.amazonaws.com
spring.mail.port=587
spring.mail.username=YOUR_SES_SMTP_USERNAME
spring.mail.password=YOUR_SES_SMTP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── JWT (shared secret for token validation) ────────────────────
app.jwt.secret=InkWellSuperSecretKeyThatIsAtLeast256BitsLongForHMACSHA256Algorithm!

# ── Application base URL (used in email links) ───────────────────
app.base-url=http://localhost:8080

# ── Async thread pool ────────────────────────────────────────────
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100

# ── Springdoc / Swagger ─────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Actuator ────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Logging ─────────────────────────────────────────────────────
logging.level.com.inkwell.newsletter=DEBUG
logging.level.org.springframework.mail=DEBUG
