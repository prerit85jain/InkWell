version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: inkwell-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 0513
      MYSQL_DATABASE: inkwell_auth
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inkwell-network

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: inkwell-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inkwell-network

  redis:
    image: redis:7-alpine
    container_name: inkwell-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - inkwell-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: inkwell-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - auth-service
      - post-service
    networks:
      - inkwell-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: inkwell-auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/inkwell_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - inkwell-network

  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile
    container_name: inkwell-post-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/inkwell_post?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - inkwell-network

  comment-service:
    build:
      context: ./comment-service
      dockerfile: Dockerfile
    container_name: inkwell-comment-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/inkwell_comment?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - inkwell-network

  category-service:
    build:
      context: ./category-service
      dockerfile: Dockerfile
    container_name: inkwell-category-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/inkwell_category?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - inkwell-network

  media-service:
    build:
      context: ./media-service
      dockerfile: Dockerfile
    container_name: inkwell-media-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/inkwell_media?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - inkwell-network

  newsletter-service:
    build:
      context: ./newsletter-service
      dockerfile: Dockerfile
    container_name: inkwell-newsletter-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/inkwell_newsletter?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - inkwell-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: inkwell-notification-service
    ports:
      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/inkwell_notification?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - inkwell-network

volumes:
  mysql_data:
  rabbitmq_data:
  redis_data:

networks:
  inkwell-network:
    driver: bridge
