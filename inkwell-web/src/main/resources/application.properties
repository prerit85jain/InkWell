# ═══════════════════════════════════════════════════════════════
#  InkWell — Web / MVC Layer  |  application.properties
# ═══════════════════════════════════════════════════════════════

# ── Server ──────────────────────────────────────────────────────
server.port=8080
spring.application.name=inkwell-web

# ── Thymeleaf ───────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ── Session ─────────────────────────────────────────────────────
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# ── OAuth2 — Google ─────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ── OAuth2 — GitHub ─────────────────────────────────────────────
spring.security.oauth2.client.registration.github.client-id=YOUR_GITHUB_CLIENT_ID
spring.security.oauth2.client.registration.github.client-secret=YOUR_GITHUB_CLIENT_SECRET
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ── Downstream service URLs ──────────────────────────────────────
app.services.auth-service.url=http://localhost:8081
app.services.post-service.url=http://localhost:8082
app.services.comment-service.url=http://localhost:8083
app.services.category-service.url=http://localhost:8084
app.services.media-service.url=http://localhost:8085
app.services.newsletter-service.url=http://localhost:8086
app.services.notification-service.url=http://localhost:8087

# ── Multipart (proxied to media-service) ────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ── Actuator ────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Logging ─────────────────────────────────────────────────────
logging.level.com.inkwell.web=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.client=DEBUG
