# ── Test profile ────────────────────────────────────────────────
spring.thymeleaf.cache=false

# Disable OAuth2 auto-config in tests
spring.security.oauth2.client.registration.google.client-id=test-id
spring.security.oauth2.client.registration.google.client-secret=test-secret
spring.security.oauth2.client.registration.github.client-id=test-id
spring.security.oauth2.client.registration.github.client-secret=test-secret

# Point all service clients to localhost (mock in tests)
app.services.auth-service.url=http://localhost:8081
app.services.post-service.url=http://localhost:8082
app.services.comment-service.url=http://localhost:8083
app.services.category-service.url=http://localhost:8084
app.services.media-service.url=http://localhost:8085
app.services.newsletter-service.url=http://localhost:8086
app.services.notification-service.url=http://localhost:8087
