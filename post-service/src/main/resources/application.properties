# ═══════════════════════════════════════════════════════════════
#  InkWell — Post Service  |  application.properties
# ═══════════════════════════════════════════════════════════════

# ── Server ──────────────────────────────────────────────────────
server.port=8082
spring.application.name=post-service

# ── DataSource (MySQL — dedicated schema per service) ───────────
spring.datasource.url=jdbc:mysql://localhost:3306/inkwell_post?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=0513
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Redis (post feed cache, TTL 5 min) ──────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# ── RabbitMQ (publish event → newsletter-service) ───────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Inter-service URLs
app.services.auth-service.url=http://localhost:8081
app.services.newsletter-service.url=http://localhost:8086
app.services.comment-service.url=http://localhost:8083

# ── Multipart upload ────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ── Springdoc / Swagger ─────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Actuator ────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── JWT (same secret as auth-service for token validation) ──────
app.jwt.secret=InkWellSuperSecretKeyThatIsAtLeast256BitsLongForHMACSHA256Algorithm!

# ── Logging ─────────────────────────────────────────────────────
logging.level.com.inkwell.post=DEBUG
logging.level.org.hibernate.SQL=DEBUG
