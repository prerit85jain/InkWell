# ═══════════════════════════════════════════════════════════════
#  InkWell — Media Service  |  application.properties
# ═══════════════════════════════════════════════════════════════

# ── Server ──────────────────────────────────────────────────────
server.port=8085
spring.application.name=media-service

# ── DataSource (MySQL — dedicated schema) ───────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/inkwell_media?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=0513
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Multipart upload limits ──────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ── AWS S3 ──────────────────────────────────────────────────────
app.aws.access-key=YOUR_AWS_ACCESS_KEY
app.aws.secret-key=YOUR_AWS_SECRET_KEY
app.aws.region=ap-south-1
app.aws.s3.bucket-name=inkwell-media
# Use CloudFront URL in production for fast delivery
app.aws.s3.base-url=https://your-cloudfront-domain.cloudfront.net

# ── JWT (shared secret for token validation) ────────────────────
app.jwt.secret=InkWellSuperSecretKeyThatIsAtLeast256BitsLongForHMACSHA256Algorithm!

# ── Inter-service URLs ───────────────────────────────────────────
app.services.auth-service.url=http://localhost:8081
app.services.post-service.url=http://localhost:8082

# ── Springdoc / Swagger ─────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Actuator ────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Logging ─────────────────────────────────────────────────────
logging.level.com.inkwell.media=DEBUG
logging.level.org.hibernate.SQL=DEBUG
