# ── Test profile ────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:inkwell_media_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Disable S3 auto-config in tests (mock S3Client in test context)
app.aws.access-key=test-key
app.aws.secret-key=test-secret
app.aws.region=us-east-1
app.aws.s3.bucket-name=test-bucket
app.aws.s3.base-url=http://localhost:4566

app.jwt.secret=TestSecretKeyForJWTSigningMustBe256BitsLong1234567890ABCDEFGHIJ
