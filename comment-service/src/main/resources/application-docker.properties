# ═══════════════════════════════════════════════════════════════
#  InkWell — Comment Service  |  application-docker.properties
# ═══════════════════════════════════════════════════════════════

# ── Server ──────────────────────────────────────────────────────
server.port=8083
spring.application.name=comment-service

# ── DataSource (MySQL — Docker container name) ───────────────────────
spring.datasource.url=jdbc:mysql://mysql:3306/inkwell_comment?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=0513
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── RabbitMQ ────────────────────────────────────────────────────
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.exchange=inkwell.exchange
app.rabbitmq.routing-key.comment-added=comment.added

# ── JWT (shared secret for token validation) ────────────────────
app.jwt.secret=InkWellSuperSecretKeyThatIsAtLeast256BitsLongForHMACSHA256Algorithm!

# ── Platform moderation flag ─────────────────────────────────────
app.comments.moderation-required=false

# ── Inter-service URLs (Docker container names) ─────────────────────
app.services.auth-service.url=http://auth-service:8081
app.services.post-service.url=http://post-service:8082

# ── Springdoc / Swagger ─────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Actuator ────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Logging ─────────────────────────────────────────────────────
logging.level.com.inkwell.comment=DEBUG
logging.level.org.hibernate.SQL=DEBUG
