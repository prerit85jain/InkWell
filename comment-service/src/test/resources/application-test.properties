# ── Test profile ────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:inkwell_comment_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

app.jwt.secret=TestSecretKeyForJWTSigningMustBe256BitsLong1234567890ABCDEFGHIJ
app.rabbitmq.exchange=inkwell.exchange
app.rabbitmq.routing-key.comment-added=comment.added
app.comments.moderation-required=false
