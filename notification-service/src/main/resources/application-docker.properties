# ═══════════════════════════════════════════════════════════════
#  InkWell — Notification Service  |  application-docker.properties
# ═══════════════════════════════════════════════════════════════

# ── Server ──────────────────────────────────────────────────────
server.port=8087
spring.application.name=notification-service

# ── DataSource (MySQL — Docker container name) ───────────────────────
spring.datasource.url=jdbc:mysql://mysql:3306/inkwell_notification?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=0513
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── RabbitMQ ────────────────────────────────────────────────────
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
app.rabbitmq.enabled=true

app.rabbitmq.exchange=inkwell.exchange
app.rabbitmq.queue.comment-events=inkwell.queue.comment-events
app.rabbitmq.queue.post-events=inkwell.queue.post-events

# ── Email (AWS SES via SMTP) ─────────────────────────────────────
spring.mail.host=email-smtp.ap-south-1.amazonaws.com
spring.mail.port=587
spring.mail.username=YOUR_SES_SMTP_USERNAME
spring.mail.password=YOUR_SES_SMTP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── JWT (shared secret for token validation) ────────────────────
app.jwt.secret=InkWellSuperSecretKeyThatIsAtLeast256BitsLongForHMACSHA256Algorithm!

# ── Async thread pool ────────────────────────────────────────────
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100

# ── Inter-service URLs (Docker container names) ───────────────────
app.services.auth-service.url=http://auth-service:8081
app.services.post-service.url=http://post-service:8082

# ── Springdoc / Swagger ─────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Actuator ────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Logging ─────────────────────────────────────────────────────
logging.level.com.inkwell.notification=DEBUG
logging.level.org.springframework.amqp=INFO
