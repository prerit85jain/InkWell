# ── Test profile ────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:inkwell_notification_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,\
  org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

app.jwt.secret=TestSecretKeyForJWTSigningMustBe256BitsLong1234567890ABCDEFGHIJ
app.rabbitmq.exchange=inkwell.exchange
app.rabbitmq.queue.comment-events=inkwell.queue.comment-events
app.rabbitmq.queue.post-events=inkwell.queue.post-events
