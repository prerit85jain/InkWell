# ═══════════════════════════════════════════════════════════════
#  InkWell — Category & Tag Service  |  application.properties
# ═══════════════════════════════════════════════════════════════

# ── Server ──────────────────────────────────────────────────────
server.port=8084
spring.application.name=category-service

# ── DataSource (MySQL — dedicated schema) ───────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/inkwell_category?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=0513
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── JWT (shared secret for token validation) ────────────────────
app.jwt.secret=InkWellSuperSecretKeyThatIsAtLeast256BitsLongForHMACSHA256Algorithm!

# ── Trending tags — number of top tags to return ────────────────
app.tags.trending-limit=10

# ── Inter-service URLs ───────────────────────────────────────────
app.services.auth-service.url=http://localhost:8081
app.services.post-service.url=http://localhost:8082

# ── Springdoc / Swagger ─────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Actuator ────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Logging ─────────────────────────────────────────────────────
logging.level.com.inkwell.category=DEBUG
logging.level.org.hibernate.SQL=DEBUG
